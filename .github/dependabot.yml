version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
          day: monday
          time: '09:00'
          timezone: 'UTC'
      open-pull-requests-limit: 5
      groups:
          astro:
              patterns:
                  - 'astro'
                  - '@astrojs/*'
                  - 'astro-*'
          react:
              patterns:
                  - 'react'
                  - 'react-dom'
                  - '@types/react'
                  - '@types/react-dom'
          eslint:
              patterns:
                  - 'eslint'
                  - 'eslint-*'
                  - '@typescript-eslint/*'
                  - 'astro-eslint-parser'
                  - '@eslint/*'
                  - '@eslint/js'
                  - 'typescript-eslint'
          tailwind:
              patterns:
                  - 'tailwindcss'
                  - '@tailwindcss/*'
                  - 'prettier-plugin-tailwindcss'
          # exclude-patterns below must list every pattern of the named groups above (Dependabot scores a pattern-less dependency-type group higher than wildcards).
          prod-minor:
              dependency-type: production
              update-types: ['minor', 'patch']
              exclude-patterns:
                  - 'astro'
                  - '@astrojs/*'
                  - 'astro-*'
                  - 'react'
                  - 'react-dom'
                  - '@types/react'
                  - '@types/react-dom'
                  - 'eslint'
                  - 'eslint-*'
                  - '@eslint/*'
                  - '@eslint/js'
                  - '@typescript-eslint/*'
                  - 'typescript-eslint'
                  - 'astro-eslint-parser'
                  - 'tailwindcss'
                  - '@tailwindcss/*'
                  - 'prettier-plugin-tailwindcss'
          dev-minor:
              dependency-type: development
              update-types: ['minor', 'patch']
              exclude-patterns:
                  - 'astro'
                  - '@astrojs/*'
                  - 'astro-*'
                  - 'react'
                  - 'react-dom'
                  - '@types/react'
                  - '@types/react-dom'
                  - 'eslint'
                  - 'eslint-*'
                  - '@eslint/*'
                  - '@eslint/js'
                  - '@typescript-eslint/*'
                  - 'typescript-eslint'
                  - 'astro-eslint-parser'
                  - 'tailwindcss'
                  - '@tailwindcss/*'
                  - 'prettier-plugin-tailwindcss'
      labels:
          - 'dependencies'

    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: weekly
          day: monday
      labels:
          - 'dependencies'
          - 'github-actions'
