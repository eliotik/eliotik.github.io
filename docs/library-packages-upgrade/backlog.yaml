# Library Packages Upgrade — Backlog
#
# Authoritative state file for the upgrade. Each task entry is mutated by a
# single agent at a time. The state machine and lane semantics are defined in
# `2026-04-29-upgrade-plan.md` §2.
#
# State machine:
#   backlog → in-progress → qa-pending → qa-in-progress → done
#                                              ↓
#                                           defect → in-progress (loop)
#
#   blocked  — set by orchestrator when depends_on is unmet
#
# Lane:  preflight | L1 | L2 | validation
# Phase: 0 | 1 | 2 | 3
#
# Mutation rules:
#  - Only the agent owning a task (worker / qa_worker) may change its status.
#  - Always commit backlog.yaml in the same commit as the work it records.
#  - Never edit a task other than your own.

